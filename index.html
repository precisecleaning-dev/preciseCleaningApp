<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!--
      ⭐ PANTALLA EN BLANCO QUE SOLO SE ARREGLA EN INCÓGNITO (10/2026).
      Durante un deploy hay unos segundos en que index.html ya es el nuevo pero
      sus archivos de /assets/ todavía no llegan. Cloudflare responde a un
      archivo que no existe con index.html (not_found_handling
      "single-page-application"), con 200 y el caché de un año de /assets/*.
      El navegador (y el Service Worker) guardan ese HTML COMO SI FUERA el
      JavaScript: desde entonces la app no arranca en ese navegador ("MIME type
      text/html"), aunque el deploy ya terminó. En incógnito no hay caché y
      funciona.
      Este script va PRIMERO para escuchar el error de esos archivos: quita el
      Service Worker y su caché, vuelve a pedir los archivos al servidor
      (fetch con cache "reload" reemplaza la copia mala) y recarga. Hasta
      MAX_REPAIR_ATTEMPTS intentos cada REPAIR_WINDOW_MS (si el deploy aún no
      termina, la página vuelve a intentar sola al pasar ese tiempo, sin un
      bucle de recargas). Sin conexión no se toca nada: el Service Worker es lo
      que deja usar la app offline. main.tsx usa window.pcRepairAssets cuando
      falla una vista de carga diferida.
      No es JSX ni el bundle: tiene que funcionar justo cuando el bundle no carga.
    -->
    <script>
      (function () {
        var ATTEMPTS_KEY = 'pc:asset-repair-attempts';
        var PENDING_URLS_KEY = 'pc:asset-repair-urls';
        var MAX_REPAIR_ATTEMPTS = 2;
        var REPAIR_WINDOW_MS = 60000;
        var isRepairing = false;
        var isRetryScheduled = false;

        function readSession(key) {
          try { return sessionStorage.getItem(key); } catch (error) { return null; }
        }
        function writeSession(key, value) {
          try {
            if (value === null) sessionStorage.removeItem(key);
            else sessionStorage.setItem(key, value);
          } catch (error) { /* sin sessionStorage: sin contador */ }
        }

        // Archivos de /assets/ que pide la página (JS, CSS y precargas) más el que falló.
        function collectAssetUrls(failedUrl) {
          var assetUrls = failedUrl ? [failedUrl] : [];
          document.querySelectorAll('script[src*="/assets/"], link[href*="/assets/"]').forEach(function (element) {
            var assetUrl = element.src || element.href;
            if (assetUrls.indexOf(assetUrl) < 0) assetUrls.push(assetUrl);
          });
          return assetUrls;
        }

        function removeServiceWorkerAndCaches() {
          var unregisterWorkers = navigator.serviceWorker && navigator.serviceWorker.getRegistrations
            ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            })
            : Promise.resolve();
          var deleteCaches = window.caches
            ? caches.keys().then(function (cacheNames) {
              return Promise.all(cacheNames.map(function (cacheName) { return caches.delete(cacheName); }));
            })
            : Promise.resolve();
          return Promise.all([unregisterWorkers, deleteCaches]).catch(function () { /* se recarga igual */ });
        }

        // Pide cada archivo al servidor y reemplaza la copia del caché HTTP.
        function refetchAssets(assetUrls) {
          return Promise.all(assetUrls.map(function (assetUrl) {
            return fetch(assetUrl, { cache: 'reload' }).catch(function () { /* sin red: se reintenta al recargar */ });
          }));
        }

        // Intentos de la ventana actual: { count, firstAt }. Pasada la ventana, de cero.
        function readAttempts() {
          var attempts = { count: 0, firstAt: Date.now() };
          try { attempts = JSON.parse(readSession(ATTEMPTS_KEY)) || attempts; } catch (error) { /* valor viejo */ }
          var isWindowOver = Date.now() - attempts.firstAt > REPAIR_WINDOW_MS;
          return isWindowOver ? { count: 0, firstAt: Date.now() } : attempts;
        }

        // Cuánto falta para que termine la ventana de intentos (+1 s).
        function readAttemptsWaitMs() {
          return Math.max(1000, readAttempts().firstAt + REPAIR_WINDOW_MS - Date.now() + 1000);
        }

        // true si arrancó (o ya va) una reparación; false si no se hizo nada.
        function repairAssets(failedUrl) {
          if (isRepairing) return true;
          if (navigator.onLine === false) return false;
          var attempts = readAttempts();
          if (attempts.count >= MAX_REPAIR_ATTEMPTS) {
            console.error('La app no pudo cargar sus archivos tras reintentar.', failedUrl);
            return false;
          }
          isRepairing = true;
          writeSession(ATTEMPTS_KEY, JSON.stringify({ count: attempts.count + 1, firstAt: attempts.firstAt }));
          var assetUrls = collectAssetUrls(failedUrl);
          var isControlledByWorker = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
          removeServiceWorkerAndCaches().then(function () {
            // Con un Service Worker al mando, el fetch le llegaría a él y no al
            // servidor: se recarga primero (ya sin worker) y se repite allá.
            if (isControlledByWorker) {
              writeSession(PENDING_URLS_KEY, JSON.stringify(assetUrls));
              return null;
            }
            return refetchAssets(assetUrls);
          }).then(function () {
            location.reload();
          });
          return true;
        }

        // Segundo paso de una reparación: la página ya no tiene Service Worker.
        var pendingUrls = readSession(PENDING_URLS_KEY);
        if (pendingUrls) {
          isRepairing = true;
          writeSession(PENDING_URLS_KEY, null);
          var parsedUrls = [];
          try { parsedUrls = JSON.parse(pendingUrls); } catch (error) { parsedUrls = []; }
          refetchAssets(parsedUrls).then(removeServiceWorkerAndCaches).then(function () {
            location.reload();
          });
        }

        // Error al cargar un <script> o <link> de /assets/ (los errores de carga
        // no suben: se escuchan en la fase de captura).
        window.addEventListener('error', function (event) {
          var element = event.target;
          var isAssetTag = element && (element.tagName === 'SCRIPT' || element.tagName === 'LINK');
          var assetUrl = isAssetTag ? element.src || element.href : '';
          if (!assetUrl || assetUrl.indexOf('/assets/') < 0) return;
          var isRepairStarted = repairAssets(assetUrl);
          // La app no arrancó y se agotaron los intentos (deploy a medias):
          // se vuelve a intentar sola cuando pasa la ventana.
          if (!isRepairStarted && !isRetryScheduled && navigator.onLine !== false) {
            isRetryScheduled = true;
            setTimeout(function () { location.reload(); }, readAttemptsWaitMs());
          }
        }, true);

        window.pcRepairAssets = repairAssets;
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- ⭐ Conexiones adelantadas a Firebase: el DNS + TLS de Firestore, Auth
         y Storage se resuelven mientras baja el JavaScript, no después
         (100–300 ms menos en la primera carga de datos en el teléfono). -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />

    <!-- ⭐ Tipografía del diseño "Unified Jobs View" (Overview e Invoices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" + onload: la hoja ya no frena el primer pintado. El login y
         el menú usan system-ui; las vistas con esta letra pintan después. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <!--
      ⭐ viewport-fit=cover: sin esto, env(safe-area-inset-*) devuelve 0 y el
      contenido queda por debajo del notch y de la barra de gestos en iPhone.
      Es requisito para que la app instalada ocupe la pantalla completa bien.

      NO se usa user-scalable=no ni maximum-scale=1: bloquear el zoom es una
      barrera de accesibilidad real para quien necesita ampliar, y iOS lo ignora
      desde hace años. El zoom accidental al escribir ya se evita con el
      font-size de 16px en los inputs (ver src/index.css).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ⭐ Pinta la barra de estado del sistema con el color de la app: es lo que
         hace que la ventana se vea como una app y no como un navegador. -->
    <meta name="theme-color" content="#0f172a" />

    <!-- ⭐ iOS: modo pantalla completa al abrir desde el ícono de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Precise" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ⭐ Evita que iOS convierta números en enlaces de teléfono y rompa el
         estilo de tablas con importes y fechas. -->
    <meta name="format-detection" content="telephone=no" />

    <title>Precise Cleaning</title>

    <style>
      /*
        ⭐ Estas reglas viven en el HTML a propósito: se aplican ANTES de que
        cargue el CSS de la app. Si estuvieran en un .css, durante los primeros
        fotogramas el gesto de arrastre todavía dispararía el "pull to refresh"
        del navegador, que en una PWA recarga todo y pierde el estado.
      */
      html, body {
        overscroll-behavior-y: none;
        background-color: #f7f9fc;
      }
      /* Pantalla de arranque: evita el destello blanco entre que carga el HTML
         y que React monta. Se oculta sola cuando #root recibe contenido. */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #f7f9fc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Con sesión guardada pintamos ya el menú y el esqueleto, sin esperar al JS (~2 s
      // en el teléfono). Mismo marcado que el esqueleto de App.tsx (ViewSkeleton): si
      // cambia uno, cambia el otro. React lo reemplaza al montar.
      try {
        if (Object.keys(localStorage).some((k) => k.startsWith('firebase:authUser:'))) {
          document.documentElement.classList.add('has-session');
          const rows = '<div class="skel-row"><div class="skel-line skel-row-main"></div><div class="skel-line skel-row-side"></div></div>'.repeat(6);
          document.getElementById('root').innerHTML =
            '<div class="app-container"><aside class="sidebar-container ' + (innerWidth > 768 ? 'open' : 'closed') + '" aria-hidden="true"></aside>' +
            '<main class="main-content"><div class="skel-page" role="status" aria-busy="true" aria-live="polite"><span class="u-sr-only">Cargando…</span>' +
            '<div class="skel-header"><div class="skel-line skel-title"></div><div class="skel-line skel-subtitle"></div></div>' +
            '<div class="skel-stats"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div>' +
            '<div class="skel-block">' + rows + '</div></div></main></div>';
        }
      } catch {
        // sin localStorage: se queda el fondo liso hasta que monte React
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
